version: "3.9"

services:
  blotils:
    image: ghcr.io/prinzpiuz/blotils:latest
    container_name: blotils
    ports:
      - 8000:8000
    volumes:
      - ./BloTils.db:/blotils/BloTils.db
      - ./config.json:/blotils/config.json
    environment:
      BT_SENDGRIDAPIKEY: ${BT_SENDGRIDAPIKEY}
      BT_ENV: ${BT_ENV}

  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - blotils

volumes:
  blotils_data:
  caddy_data:
