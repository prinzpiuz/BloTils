version: "3.9"

services:
  blotils:
    build: .
    ports:
      - "8000:8000" # Still useful for debugging, but not the primary entry point
    volumes:
      - ./BloTils.db:/blotils/BloTils.db # Persist SQLite database
      - ./config.json:/blotils/config.json # Mount config files
    environment:
      BT_SENDGRIDAPIKEY: ${BT_SENDGRIDAPIKEY}
      BT_ENV: ${BT_ENV}
    # No depends_on caddy needed if caddy depends on go-app

  caddy:
    image: caddy:latest # Use the official Caddy image
    ports:
      - "80:80" # HTTP for automatic HTTPS challenge or direct HTTP
      - "443:443" # HTTPS
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro # Mount your Caddyfile
      - caddy_data:/data # Caddy needs a volume for its automatic HTTPS data (certificates, etc.)
    depends_on:
      - go-app # Caddy should start after the Go application

volumes:
  go_app_data:
  caddy_data: # Define the named volume for Caddy's data
