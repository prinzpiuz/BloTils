services:
  blotils:
    image: ghcr.io/prinzpiuz/blotils:latest
    container_name: blotils
    networks:
      - backend
    volumes:
      - ../../BloTils_Data/BloTils.db:/blotils/BloTils.db
      - ../../BloTils_Data/config.json:/blotils/config.json
    environment:
      BT_SENDGRIDAPIKEY: ${BT_SENDGRIDAPIKEY}
      BT_ENV: production
      BT_DBLOCATION: /blotils/BloTils.db
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:latest
    container_name: caddy
    networks:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge
