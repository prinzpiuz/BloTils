name: Build and Push Docker Image to GHCR

on:
  push:
    # branches:
    #   - main
    # tags:
    #   - '*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # The build context is the current directory (where the Dockerfile is)
          push: true # Set to true to push the image to the registry
          tags: | # Define the tags for the image
            ghcr.io/${{ github.repository }}:latest # latest tag for the main branch
            ghcr.io/${{ github.repository }}:${{ github.sha }} # Tag with the full Git SHA for uniqueness
            # Add a tag based on the Git ref name if it's a tag push
            ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}:{1}', github.repository, github.ref_name) || '' }}
          labels: | # Add Docker image labels for metadata and documentation
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docker/README.md
            org.opencontainers.image.description=BloTils aks Blog-Utils.
            com.example.build-date=${{ github.event.head_commit.timestamp }}
            com.example.version=${{ github.ref_name }}
          cache-from: type=gha # Cache layers from GitHub Actions cache for faster builds
          cache-to: type=gha,mode=max # Cache layers to GitHub Actions cache
