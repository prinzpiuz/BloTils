name: Build and Release BloTils.js

on:
    push:
        branches:
            - release
        paths:
            - "static/js/BloTils.js"

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Get current JS version and bump
              id: version
              run: |
                  # Read current version
                  CURRENT=$(jq -r '.version' static/js/version.json)

                  # Parse semver components
                  IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

                  # Bump patch version
                  NEW_PATCH=$((PATCH + 1))
                  NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

                  echo "current=$CURRENT" >> $GITHUB_OUTPUT
                  echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install Terser
              run: npm install -g terser

            - name: Create dist directory
              run: mkdir -p dist

            - name: Copy original file
              run: cp static/js/BloTils.js dist/BloTils.js

            - name: Minify JavaScript
              run: |
                  terser dist/BloTils.js \
                    --compress \
                    --mangle \
                    --output dist/BloTils.min.js \
                    --comments "/^!|@license|@preserve/"

            - name: Generate SRI hashes
              run: |
                  HASH_ORIGINAL=$(cat dist/BloTils.js | openssl dgst -sha384 -binary | openssl base64 -A)
                  HASH_MINIFIED=$(cat dist/BloTils.min.js | openssl dgst -sha384 -binary | openssl base64 -A)
                  VERSION=${{ steps.version.outputs.version }}

                  cat > dist/integrity.json << EOF
                  {
                    "version": "${VERSION}",
                    "files": {
                      "BloTils.js": {
                        "sri": "sha384-${HASH_ORIGINAL}",
                        "size": "$(wc -c < dist/BloTils.js | tr -d ' ') bytes"
                      },
                      "BloTils.min.js": {
                        "sri": "sha384-${HASH_MINIFIED}",
                        "size": "$(wc -c < dist/BloTils.min.js | tr -d ' ') bytes"
                      }
                    },
                    "jsdelivr": {
                      "original": "https://cdn.jsdelivr.net/gh/${{ github.repository }}@js-v${VERSION}/dist/BloTils.js",
                      "minified": "https://cdn.jsdelivr.net/gh/${{ github.repository }}@js-v${VERSION}/dist/BloTils.min.js"
                    }
                  }
                  EOF

                  cat > dist/USAGE.md << 'USAGE_EOF'
                  # BloTils.js VERSION_PLACEHOLDER

                  ## CDN Links (jsDelivr)

                  ### Minified (Recommended for production)
                    ```html
                        <script
                            src="https://cdn.jsdelivr.net/gh/REPO_PLACEHOLDER@js-vVERSION_PLACEHOLDER/dist/BloTils.min.js"
                            integrity="HASH_MIN_PLACEHOLDER"
                            crossorigin="anonymous"
                            data-blotils_url="https://blotils.prinzpiuz.in"
                            data-blotils_like_btn="blotils_like_btn">
                        </script>
                    ```

                  ### Original (For debugging)
                    ```html
                        <script
                            src="https://cdn.jsdelivr.net/gh/REPO_PLACEHOLDER@js-vVERSION_PLACEHOLDER/dist/BloTils.js"
                            integrity="HASH_ORIG_PLACEHOLDER"
                            crossorigin="anonymous"
                            data-blotils_url="https://blotils.prinzpiuz.in"
                            data-blotils_like_btn="blotils_like_btn">
                        </script>
                    ```
                  USAGE_EOF

                  sed -i "s|VERSION_PLACEHOLDER|${VERSION}|g" dist/USAGE.md
                  sed -i "s|REPO_PLACEHOLDER|${{ github.repository }}|g" dist/USAGE.md
                  sed -i "s|HASH_MIN_PLACEHOLDER|sha384-${HASH_MINIFIED}|g" dist/USAGE.md
                  sed -i "s|HASH_ORIG_PLACEHOLDER|sha384-${HASH_ORIGINAL}|g" dist/USAGE.md

                  echo "HASH_ORIGINAL=sha384-${HASH_ORIGINAL}" >> $GITHUB_ENV
                  echo "HASH_MINIFIED=sha384-${HASH_MINIFIED}" >> $GITHUB_ENV
                  echo "VERSION=${VERSION}" >> $GITHUB_ENV

            - name: Update version file and commit
              run: |
                  # Update version file
                  echo '{"version": "${{ env.VERSION }}"}' > static/js/version.json

                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git add dist/ static/js/version.json
                  git commit -m "Build: BloTils.js v${{ env.VERSION }}" || echo "No changes to commit"
                  git push origin HEAD:release

            - name: Create and push tag
              run: |
                  git tag "js-v${{ env.VERSION }}"
                  git push origin "js-v${{ env.VERSION }}"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: js-v${{ env.VERSION }}
                  name: BloTils.js v${{ env.VERSION }}
                  body: |
                      ## BloTils.js v${{ env.VERSION }}

                      ### CDN Links

                      **Minified (Recommended):**
                      ```html
                          <script
                          src="https://cdn.jsdelivr.net/gh/${{ github.repository }}@js-v${{ env.VERSION }}/dist/BloTils.min.js"
                          integrity="${{ env.HASH_MINIFIED }}"
                          crossorigin="anonymous"
                          data-blotils_url="https://www.blotils.prinzpiuz.in"
                          data-blotils_like_btn="blotils_like_btn">
                          </script>
                      ```

                      **Original:**
                      ```html
                          <script
                          src="https://cdn.jsdelivr.net/gh/${{ github.repository }}@js-v${{ env.VERSION }}/dist/BloTils.js"
                          integrity="${{ env.HASH_ORIGINAL }}"
                          crossorigin="anonymous"
                          data-blotils_url="https://www.blotils.prinzpiuz.in"
                          data-blotils_like_btn="blotils_like_btn">
                          </script>
                      ```

                      ### SRI Hashes
                      | File | Integrity Hash |
                      |------|----------------|
                      | `BloTils.js` | `${{ env.HASH_ORIGINAL }}` |
                      | `BloTils.min.js` | `${{ env.HASH_MINIFIED }}` |
                  files: |
                      dist/BloTils.js
                      dist/BloTils.min.js
                      dist/integrity.json
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
