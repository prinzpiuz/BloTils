{{ define "content" }} {{ template "add_domain_modal.html" . }}
<div class="user-list-container">
    <div class="list-header">
        <h2>Configured Domains</h2>
        {{ if .Data.domains }}
        <div class="cta-buttons">
            <button id="openModalBtn">Add Domain</button>
        </div>
        {{ end }}
    </div>

    {{ if .Data.domains }}
    <table class="user-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Domain</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {{ range .Data.domains }}
            <tr>
                <td>{{ .Id }}</td>
                <td>
                    <a
                        href="domain/{{.Id}}"
                        class="domain-link"
                        >{{ .Domain }}</a
                    >
                </td>
                <td class="actions-cell">
                    <a
                        href="#"
                        class="action-icon edit-icon edit-domain"
                        data-id="{{.Id}}"
                        data-domain="{{.Domain}}"
                        data-likes="{{.LikesEnabled}}"
                        data-comments="{{.CommentsEnabled}}"
                        title="Edit"
                        aria-label="Edit domain"
                    >
                        <img
                            src="/{{$.Static}}/icons/edit.svg"
                            alt="Edit"
                        />
                    </a>
                    <form
                        action="/delete_domain/{{.Id}}"
                        method="POST"
                        class="delete-form"
                        onsubmit="
                            return confirm(
                                'Are you sure you want to delete this domain?',
                            );
                        "
                    >
                        <input
                            type="hidden"
                            name="csrfToken"
                            value="{{$.CSRFToken}}"
                        />
                        <button
                            type="submit"
                            class="action-icon delete-icon"
                            title="Delete"
                            aria-label="Delete domain"
                        >
                            <img
                                src="/{{$.Static}}/icons/delete.svg"
                                alt="Delete"
                            />
                        </button>
                    </form>
                </td>
            </tr>
            {{ end }}
        </tbody>
    </table>
    {{ else }}
    <div class="no-data-container">
        <p class="no-data">No Domains found.</p>
        <div class="cta-buttons">
            <button id="openModalBtn">Add Domain</button>
        </div>
    </div>
    {{ end }}
</div>
<script src="{{.Static}}/js/add_site.js"></script>
{{ end }}
