{{ define "content" }}

<h1>Forgot Password</h1>
<div id="forgot_password">
  <html>
    <body>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />
        <input type="email" name="email" placeholder="Email" required />
        <button type="submit">Send Reset Link</button>
      </form>
    </body>
  </html>
</div>
{{ end }}
